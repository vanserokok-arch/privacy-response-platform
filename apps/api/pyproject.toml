[project]
name = "privacy-response-api"
version = "0.1.0"
description = "Privacy Response Platform API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy>=2.0.40",
  "alembic>=1.16.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.10.0",
  "redis>=6.0.0",
  "celery>=5.5.0",
  "playwright>=1.54.0",
  "boto3>=1.39.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.28.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"
